---
# Shared handlers for PRISM playbooks
# These handlers can be reused across all playbooks

- name: Update GRUB
  ansible.builtin.command: update-grub
  changed_when: true
  when: not prism_is_container

- name: Restart SSH service
  ansible.builtin.systemd:
    name: "{{ prism_ssh_service_name }}"
    state: restarted

- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
  register: prism_auditd_restart
  failed_when: prism_auditd_restart.failed and not prism_is_container

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  register: prism_sysctl_apply
  changed_when: true
  failed_when: prism_sysctl_apply.rc != 0 and not prism_is_container

- name: Update initramfs
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  when: not prism_is_container

- name: Reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: Restart zramswap
  ansible.builtin.systemd:
    name: zramswap.service
    state: restarted
  failed_when: false

- name: Restart Docker service
  ansible.builtin.systemd:
    name: docker
    state: restarted
