---
- name: Configure auditing and logging for Wazuh integration
  hosts: all
  become: true
  handlers:
    - name: Import shared handlers
      ansible.builtin.import_tasks: handlers/main.yml

  tasks:
    - name: Skip audit and logging configuration on container targets
      ansible.builtin.debug:
        msg: "Skipping audit/logging configuration because target type is resolved as container and features.target.container_support.audit_logging is false."
      when:
        - prism_is_container
        - not prism_container_audit_enabled

    - name: End audit/logging play on container targets
      ansible.builtin.meta: end_play
      when:
        - prism_is_container
        - not prism_container_audit_enabled

    - name: Select audit/logging package set
      ansible.builtin.set_fact:
        prism_enable_auditd: "{{ (not prism_is_container) and ((not prism_wazuh_mode_enabled) or prism_wazuh_keep_auditd) }}"
        prism_enable_sysstat: >-
          {{
            (
              (not prism_wazuh_mode_enabled) or
              (not prism_wazuh_reduce_redundant) or
              prism_wazuh_keep_sysstat
            )
          }}
        prism_enable_acct: "{{ (not prism_is_container) and ((not prism_wazuh_mode_enabled) or (not prism_wazuh_reduce_redundant)) }}"
        prism_syslog_forward_enabled: "{{ features.audit_logging.syslog_forwarding.enabled | default(false) | bool }}"

    - name: Build effective audit/logging package and service lists
      ansible.builtin.set_fact:
        prism_audit_packages: >-
          {{
            (['auditd', 'audispd-plugins'] if prism_enable_auditd else [])
            + (['sysstat'] if prism_enable_sysstat else [])
            + (['acct'] if prism_enable_acct else [])
            + (['rsyslog'] if prism_syslog_forward_enabled else [])
          }}
        prism_monitoring_services: >-
          {{
            (['auditd'] if prism_enable_auditd else [])
            + (['sysstat'] if prism_enable_sysstat else [])
            + (['acct'] if prism_enable_acct else [])
          }}

    - name: Install audit and monitoring packages
      ansible.builtin.include_tasks: tasks/install_packages.yml
      vars:
        package_list: "{{ prism_audit_packages }}"
      when: prism_audit_packages | length > 0

    - name: Enable system monitoring services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        masked: false
      loop: "{{ prism_monitoring_services }}"
      when: prism_monitoring_services | length > 0

    - name: Enable sysstat data collection
      ansible.builtin.lineinfile:
        path: /etc/default/sysstat
        regexp: "^ENABLED="
        line: 'ENABLED="true"'
        state: present
      when:
        - ansible_facts['os_family'] == "Debian"
        - prism_enable_sysstat

    - name: Ensure audit rules directory exists
      ansible.builtin.file:
        path: /etc/audit/rules.d
        state: directory
        owner: "{{ default_root_owner }}"
        group: "{{ default_root_group }}"
        mode: "0750"
      when: prism_enable_auditd

    - name: Configure audit rules for Wazuh integration
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/hardening.rules
        mode: "{{ default_secure_mode }}"
        owner: "{{ default_root_owner }}"
        group: "{{ default_root_group }}"
        content: |
          # Delete all existing rules
          -D

          # Buffer size
          -b 8192

          # Failure mode (0=silent 1=printk 2=panic)
          -f 1

          # Monitor unauthorized access attempts
          -a always,exit -F arch=b64 -S open,openat,openat2 -F exit=-EACCES -k access
          -a always,exit -F arch=b64 -S open,openat,openat2 -F exit=-EPERM -k access

          # Monitor modifications to critical files
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/sudoers -p wa -k sudoers
          -w /etc/sudoers.d/ -p wa -k sudoers

          # Monitor system calls
          -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time_change
          -a always,exit -F arch=b64 -S sethostname,setdomainname -k system_locale
          -a always,exit -F arch=b64 -S mount,umount2 -k mounts

          # Monitor SSH configuration
          -w /etc/ssh/sshd_config -p wa -k sshd_config

          # Make configuration immutable
          -e 2
      when: prism_enable_auditd
      notify: Restart auditd

    - name: Configure remote syslog forwarding
      ansible.builtin.template:
        src: templates/99-prism-remote-syslog.conf.j2
        dest: /etc/rsyslog.d/99-prism-remote-syslog.conf
        owner: "{{ default_root_owner }}"
        group: "{{ default_root_group }}"
        mode: "{{ default_file_mode }}"
      when: prism_syslog_forward_enabled
      notify: Restart rsyslog

    - name: Remove remote syslog forwarding config when disabled
      ansible.builtin.file:
        path: /etc/rsyslog.d/99-prism-remote-syslog.conf
        state: absent
      when: not prism_syslog_forward_enabled
      notify: Restart rsyslog

    - name: Ensure rsyslog service is enabled and started
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started
      when: prism_syslog_forward_enabled
