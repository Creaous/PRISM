---
# Reusable task to install packages with retry logic
# Usage: include_tasks with vars: package_list (array of package names)

- name: Validate supported OS family for package installation
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'Alpine']
    fail_msg: "Unsupported OS family '{{ ansible_facts['os_family'] }}' for tasks/install_packages.yml"

- name: Install packages on Debian
  ansible.builtin.apt:
    name: "{{ package_list }}"
    state: present
    update_cache: "{{ update_cache | default(true) }}"
    cache_valid_time: "{{ cache_valid_time | default(3600) }}"
  when: ansible_facts['os_family'] == "Debian"
  retries: "{{ package_retry_count | default(3) }}"
  delay: "{{ package_retry_delay | default(5) }}"
  register: package_install_result_debian
  until: package_install_result_debian is success

- name: Install packages on Alpine
  community.general.apk:
    name: "{{ package_list }}"
    state: present
    update_cache: "{{ update_cache | default(true) }}"
  when: ansible_facts['os_family'] == "Alpine"
  retries: "{{ package_retry_count | default(3) }}"
  delay: "{{ package_retry_delay | default(5) }}"
  register: package_install_result_alpine
  until: package_install_result_alpine is success
