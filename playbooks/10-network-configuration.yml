- name: Configure networking
  hosts: all
  become: true
  handlers:
    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted
    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
  tasks:
    - name: Skip networking play on container targets
      ansible.builtin.debug:
        msg: "Skipping network reconfiguration because target type is resolved as container and features.target.container_support.networking is false."
      when:
        - features.networking.enabled | default(false)
        - prism_is_container
        - not prism_container_networking_enabled

    - name: End networking play on container targets
      ansible.builtin.meta: end_play
      when:
        - features.networking.enabled | default(false)
        - prism_is_container
        - not prism_container_networking_enabled

    - name: Configure hostname
      when:
        - features.system.hostname is defined
        - features.system.hostname | length > 0
      block:
        - name: Get current hostname
          ansible.builtin.command: hostname
          register: current_hostname
          changed_when: false

        - name: Set hostname
          ansible.builtin.hostname:
            name: "{{ features.system.hostname }}"
            use: systemd
          when: current_hostname.stdout != features.system.hostname

        - name: Remove old hostname from /etc/hosts
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1\s+{{ current_hostname.stdout }}(\s|$)'
            state: absent
          when: current_hostname.stdout != features.system.hostname

        - name: Update /etc/hosts with new hostname
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1\s+'
            line: "127.0.1.1\t{{ features.system.hostname }}"
            state: present

    - name: Configure networking
      when:
        - features.networking.enabled | default(false)
        - features.networking is defined
        - features.networking | length > 0
      block:
        - name: Set networking backend
          ansible.builtin.set_fact:
            prism_networking_backend: "{{ features.networking.backend | default('networkmanager') | lower }}"

        - name: Validate networking backend
          ansible.builtin.assert:
            that:
              - prism_networking_backend in ['networkmanager', 'ifupdown']
            fail_msg: "Invalid features.networking.backend. Allowed values: networkmanager, ifupdown"
            success_msg: "Networking backend {{ prism_networking_backend }} is valid"

        - name: Validate networking auto-gateway prerequisites
          ansible.builtin.assert:
            that:
              - features.networking.ip4 is defined
              - (features.networking.ip4 | string) is search('/[0-9]+$')
            fail_msg: "features.networking.auto_gateway requires features.networking.ip4 in CIDR format, for example 192.168.10.20/24"
            success_msg: "Auto-gateway prerequisites are valid"
          when: features.networking.auto_gateway | default(true)

        - name: Compute gateway from interface CIDR
          ansible.builtin.command: >-
            python3 -c "import ipaddress; net = ipaddress.ip_interface('{{ features.networking.ip4 }}').network; print(next(net.hosts()))"
          register: prism_auto_gateway
          changed_when: false
          when: features.networking.auto_gateway | default(true)

        - name: Set effective gateway
          ansible.builtin.set_fact:
            prism_effective_gateway: >-
              {{
                (prism_auto_gateway.stdout | trim)
                if (features.networking.auto_gateway | default(true))
                else (features.networking.gw4 | string)
              }}

        - name: Build DNS extras list
          ansible.builtin.set_fact:
            prism_dns_extra_list: "{{ features.networking.dns_extra | default([]) }}"
          when: features.networking.auto_dns | default(true)

        - name: Build effective DNS list
          ansible.builtin.set_fact:
            prism_effective_dns_list: >-
              {{
                [prism_effective_gateway] + prism_dns_extra_list
                if (features.networking.auto_dns | default(true))
                else
                (
                  features.networking.dns
                  if (features.networking.dns is defined and features.networking.dns is sequence and features.networking.dns is not string)
                  else
                  (
                    (features.networking.dns | default('') | string).split()
                  )
                )
              }}

        - name: Set systemd-resolved primary and fallback DNS
          ansible.builtin.set_fact:
            prism_resolved_primary_dns: "{{ (prism_effective_dns_list | first) | default('') }}"
            prism_resolved_fallback_dns_list: >-
              {{
                (
                  (prism_effective_dns_list[1:] | default([]))
                  +
                  (features.networking.systemd_resolved.fallback_dns | default([]))
                ) | unique
              }}

        - name: Set effective DNS string
          ansible.builtin.set_fact:
            prism_effective_dns_string: "{{ prism_effective_dns_list | join(' ') }}"

        - name: Ensure systemd-resolved is installed
          ansible.builtin.apt:
            name: systemd-resolved
            state: present
            update_cache: true
          when: features.networking.systemd_resolved.enabled | default(true)

        - name: Configure systemd-resolved
          ansible.builtin.template:
            src: templates/systemd-resolved.conf.j2
            dest: /etc/systemd/resolved.conf
            owner: root
            group: root
            mode: "0644"
          notify: Restart systemd-resolved
          when: features.networking.systemd_resolved.enabled | default(true)

        - name: Ensure systemd-resolved service is enabled and started
          ansible.builtin.systemd:
            name: systemd-resolved
            enabled: true
            state: started
          when: features.networking.systemd_resolved.enabled | default(true)

        - name: Configure /etc/resolv.conf to use systemd-resolved stub
          ansible.builtin.file:
            src: /run/systemd/resolve/stub-resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true
          when:
            - features.networking.systemd_resolved.enabled | default(true)
            - features.networking.systemd_resolved.stub_listener | default(true)

        - name: Configure /etc/resolv.conf to use systemd-resolved full resolver list
          ansible.builtin.file:
            src: /run/systemd/resolve/resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true
          when:
            - features.networking.systemd_resolved.enabled | default(true)
            - not (features.networking.systemd_resolved.stub_listener | default(true))

        - name: Configure static networking with NetworkManager
          when: prism_networking_backend == 'networkmanager'
          block:
            - name: Ensure network-manager is installed
              ansible.builtin.apt:
                name: network-manager
                state: present
                update_cache: true

            - name: Set NetworkManager managed=true
              ansible.builtin.lineinfile:
                path: /etc/NetworkManager/NetworkManager.conf
                regexp: "^managed=false"
                line: "managed=true"
              notify: Restart NetworkManager

            - name: Set static ethernet name from ifname
              ansible.builtin.set_fact:
                static_eth_name: "static-{{ features.networking.ifname }}"
              when:
                - features.networking.ifname is defined

            - name: Add static ethernet connection
              ansible.builtin.command: >
                nmcli con add type ethernet con-name {{ static_eth_name }}
                ifname {{ features.networking.ifname }} ip4 {{ features.networking.ip4 }} gw4 {{ prism_effective_gateway }}
              args:
                creates: "/etc/NetworkManager/system-connections/{{ static_eth_name }}.nmconnection"
              when:
                - features.networking.ifname is defined
                - features.networking.ip4 is defined

            - name: Ensure gateway and IPv4 settings are current
              ansible.builtin.command: >
                nmcli con mod {{ static_eth_name }}
                ipv4.addresses {{ features.networking.ip4 }}
                ipv4.gateway {{ prism_effective_gateway }}
                ipv4.method manual
              changed_when: false
              when:
                - features.networking.ifname is defined
                - features.networking.ip4 is defined

            - name: Disable DNS from DHCP in NetworkManager static profile
              ansible.builtin.command: >
                nmcli con mod {{ static_eth_name }} ipv4.ignore-auto-dns yes
              changed_when: false
              when:
                - features.networking.ifname is defined

            - name: Set DNS servers for static ethernet
              ansible.builtin.command: >
                nmcli con mod {{ static_eth_name }} ipv4.dns "{{ prism_effective_dns_string }}"
              changed_when: false
              when:
                - prism_effective_dns_list | length > 0

            - name: Bring up static ethernet connection
              ansible.builtin.command: nmcli con up {{ static_eth_name }}
              changed_when: false
              when:
                - features.networking.ifname is defined

        - name: Configure static networking with ifupdown
          when: prism_networking_backend == 'ifupdown'
          block:
            - name: Ensure ifupdown is installed
              ansible.builtin.apt:
                name: ifupdown
                state: present
                update_cache: true

            - name: Ensure interfaces include drop-in files
              ansible.builtin.lineinfile:
                path: /etc/network/interfaces
                line: "source /etc/network/interfaces.d/*.cfg"
                state: present

            - name: Configure static interface in interfaces.d
              ansible.builtin.copy:
                dest: "/etc/network/interfaces.d/{{ features.networking.ifname }}.cfg"
                owner: root
                group: root
                mode: "0644"
                content: |
                  auto {{ features.networking.ifname }}
                  iface {{ features.networking.ifname }} inet static
                      address {{ features.networking.ip4 }}
                    gateway {{ prism_effective_gateway }}
                  {% if prism_effective_dns_list | length > 0 %}
                    dns-nameservers {{ prism_effective_dns_string }}
                  {% endif %}
              when:
                - features.networking.ifname is defined
                - features.networking.ip4 is defined

            - name: Bring up interface with ifupdown
              ansible.builtin.command: ifup {{ features.networking.ifname }}
              changed_when: false
              failed_when: false
              when:
                - features.networking.ifname is defined
