---
# Pre-flight validation playbook for PRISM
# Run this before executing the main playbook to verify prerequisites
# Usage: ansible-playbook -i inventory.ini validate.yml -e "@config.yml"

- name: Validate PRISM prerequisites and configuration
  hosts: all
  gather_facts: true
  become: false

  tasks:
    - name: Check Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.12', '>=')
        fail_msg: "Ansible 2.12 or higher is required. Current version: {{ ansible_version.full }}"
        success_msg: "Ansible version {{ ansible_version.full }} is compatible"
      delegate_to: localhost
      run_once: true

    - name: Verify config.yml is loaded
      ansible.builtin.assert:
        that:
          - features is defined
        fail_msg: "Configuration file not loaded. Run with: -e '@config.yml'"
        success_msg: "Configuration file loaded successfully"
      run_once: true

    - name: Validate target type selection
      ansible.builtin.assert:
        that:
          - (features.target.type | default('auto') | lower) in ['auto', 'vm', 'lxc', 'container']
        fail_msg: "Invalid features.target.type. Allowed values: auto, vm, lxc, container"
        success_msg: "Target type configuration is valid"
      run_once: true

    - name: Display target platform detection
      ansible.builtin.debug:
        msg:
          - "Target type configured: {{ features.target.type | default('auto') | lower }}"
          - "Virtualization facts: role={{ prism_virtualization_role }}, type={{ prism_virtualization_type }}"
          - "Resolved target type: {{ prism_target_type_resolved }}"
      run_once: true

    - name: Check OS distribution
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - ansible_facts['distribution'] == "Debian"
        fail_msg: |
          Unsupported OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          PRISM currently supports Debian 12 targets for full hardening flows
        success_msg: "OS is {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} (supported)"

    - name: Check Python 3 availability
      ansible.builtin.command: python3 --version
      register: python_version
      changed_when: false
      failed_when: python_version.rc != 0

    - name: Display Python version
      ansible.builtin.debug:
        msg: "Python version: {{ python_version.stdout }}"

    - name: Check SSH connectivity
      ansible.builtin.ping:

    - name: Verify privilege escalation
      ansible.builtin.command: id -u
      register: user_id
      become: true
      changed_when: false

    - name: Confirm root privileges
      ansible.builtin.assert:
        that:
          - user_id.stdout == "0"
        fail_msg: "Cannot escalate privileges to root"
        success_msg: "Privilege escalation working correctly"

    - name: Check for required system commands
      ansible.builtin.command: "which {{ item }}"
      register: command_check
      changed_when: false
      failed_when: false
      loop:
        - apt
        - systemctl
        - sysctl
      become: true

    - name: Check for GRUB tooling on VM targets
      ansible.builtin.command: which update-grub
      register: grub_command_check
      changed_when: false
      failed_when: false
      become: true
      when: not prism_is_container

    - name: Validate GRUB password hash format (if enabled)
      ansible.builtin.assert:
        that:
          - features.grub_password.hash is defined
          - features.grub_password.hash | length > 0
          - features.grub_password.hash is match('^grub\\.pbkdf2\\.sha512\\.')
        fail_msg: |
          Invalid GRUB password hash format.
          Generate with: grub-mkpasswd-pbkdf2
        success_msg: "GRUB password hash format is valid"
      when:
        - features.grub_password.enabled | default(false)
      run_once: true

    - name: Validate SSH port configuration
      ansible.builtin.assert:
        that:
          - features.ssh_hardening.port is defined
          - features.ssh_hardening.port | int > 0
          - features.ssh_hardening.port | int < 65536
        fail_msg: "Invalid SSH port: {{ features.ssh_hardening.port }}"
        success_msg: "SSH port {{ features.ssh_hardening.port }} is valid"
      when:
        - features.ssh_hardening.enabled | default(false)
        - features.ssh_hardening.port is defined
      run_once: true

    - name: Validate resource optimization parameters
      ansible.builtin.assert:
        that:
          - (features.resource_optimization.zram_percent | default(25) | int) >= 5
          - (features.resource_optimization.zram_percent | default(25) | int) <= 80
          - (features.resource_optimization.vm_swappiness | default(20) | int) >= 0
          - (features.resource_optimization.vm_swappiness | default(20) | int) <= 100
        fail_msg: "Invalid resource optimization settings in features.resource_optimization."
        success_msg: "Resource optimization settings are valid"
      when: features.resource_optimization.enabled | default(false)
      run_once: true

    - name: Validate Checkmk deployment settings (if enabled)
      ansible.builtin.assert:
        that:
          - features.agent_deployment.checkmk.package_url is defined
          - features.agent_deployment.checkmk.package_url | length > 0
          - features.agent_deployment.checkmk.server is defined
          - features.agent_deployment.checkmk.server | length > 0
          - features.agent_deployment.checkmk.site is defined
          - features.agent_deployment.checkmk.site | length > 0
          - features.agent_deployment.checkmk.user is defined
          - features.agent_deployment.checkmk.user | length > 0
          - features.agent_deployment.checkmk.password is defined
          - features.agent_deployment.checkmk.password | length > 0
        fail_msg: "Invalid Checkmk deployment settings in features.agent_deployment.checkmk"
        success_msg: "Checkmk deployment settings are valid"
      when:
        - features.agent_deployment.enabled | default(false)
        - features.agent_deployment.checkmk.enabled | default(false)
      run_once: true

    - name: Validate Checkmk firewall integration settings (if enabled)
      ansible.builtin.assert:
        that:
          - (features.agent_deployment.checkmk.agent_port | default(6556) | int) > 0
          - (features.agent_deployment.checkmk.agent_port | default(6556) | int) < 65536
        fail_msg: "Invalid features.agent_deployment.checkmk.agent_port value"
        success_msg: "Checkmk firewall settings are valid"
      when:
        - features.agent_deployment.enabled | default(false)
        - features.agent_deployment.checkmk.enabled | default(false)
        - features.agent_deployment.checkmk.configure_firewall | default(true)
      run_once: true

    - name: Validate Wazuh deployment settings (if enabled)
      ansible.builtin.assert:
        that:
          - features.agent_deployment.wazuh.package_url is defined
          - features.agent_deployment.wazuh.package_url | length > 0
          - features.agent_deployment.wazuh.manager is defined
          - features.agent_deployment.wazuh.manager | length > 0
        fail_msg: "Invalid Wazuh deployment settings in features.agent_deployment.wazuh"
        success_msg: "Wazuh deployment settings are valid"
      when:
        - features.agent_deployment.enabled | default(false)
        - features.agent_deployment.wazuh.enabled | default(false)
      run_once: true

    - name: Validate Docker deployment settings (if enabled)
      ansible.builtin.assert:
        that:
          - features.docker_deployment.install_compose_plugin is defined
          - features.docker_deployment.manage_daemon_config is defined
          - (features.docker_deployment.users | default([])) is iterable
          - (features.docker_deployment.daemon.log_max_size | default('10m') | string) | length > 0
          - (features.docker_deployment.daemon.log_max_file | default('3') | string) | length > 0
        fail_msg: "Invalid Docker deployment settings in features.docker_deployment"
        success_msg: "Docker deployment settings are valid"
      when:
        - features.docker_deployment.enabled | default(false)
      run_once: true

    - name: Validate syslog forwarding settings (if enabled)
      ansible.builtin.assert:
        that:
          - (features.audit_logging.syslog_forwarding.host | default('') | string | length) > 0
          - (features.audit_logging.syslog_forwarding.port | default(514) | int) > 0
          - (features.audit_logging.syslog_forwarding.port | default(514) | int) < 65536
          - (features.audit_logging.syslog_forwarding.protocol | default('udp') | lower) in ['udp', 'tcp']
        fail_msg: "Invalid features.audit_logging.syslog_forwarding settings"
        success_msg: "Syslog forwarding settings are valid"
      when:
        - features.audit_logging.enabled | default(false)
        - features.audit_logging.syslog_forwarding.enabled | default(false)
      run_once: true

    - name: Warn about SSH port change
      ansible.builtin.debug:
        msg: |
          WARNING: SSH port will be changed to {{ features.ssh_hardening.port }}
          Ensure firewall allows this port before proceeding!
      when:
        - features.ssh_hardening.enabled | default(false)
        - features.ssh_hardening.port is defined
        - features.ssh_hardening.port != 22
      run_once: true

    - name: Validate firewall configuration
      ansible.builtin.assert:
        that:
          - features.firewall.default_target in ['DROP', 'ACCEPT', 'REJECT', 'default']
        fail_msg: "Invalid firewall default_target: {{ features.firewall.default_target }}"
        success_msg: "Firewall configuration is valid"
      when:
        - features.firewall.enabled | default(false)
      run_once: true

    - name: Validate networking backend configuration
      ansible.builtin.assert:
        that:
          - (features.networking.backend | default('networkmanager') | lower) in ['networkmanager', 'ifupdown']
        fail_msg: "Invalid features.networking.backend. Allowed values: networkmanager, ifupdown"
        success_msg: "Networking backend configuration is valid"
      when:
        - features.networking.enabled | default(false)
      run_once: true

    - name: Validate networking auto-gateway settings
      ansible.builtin.assert:
        that:
          - (features.networking.ip4 | string) is search('/[0-9]+$')
        fail_msg: "features.networking.auto_gateway requires features.networking.ip4 in CIDR format, for example 192.168.10.20/24"
        success_msg: "Networking auto-gateway settings are valid"
      when:
        - features.networking.enabled | default(false)
        - features.networking.auto_gateway | default(true)
      run_once: true

    - name: Validate networking manual gateway settings
      ansible.builtin.assert:
        that:
          - features.networking.gw4 is defined
          - (features.networking.gw4 | string | length) > 0
        fail_msg: "features.networking.gw4 must be set when features.networking.auto_gateway is false"
        success_msg: "Networking manual gateway settings are valid"
      when:
        - features.networking.enabled | default(false)
        - not (features.networking.auto_gateway | default(true))
      run_once: true

    - name: Validate systemd-resolved settings
      ansible.builtin.assert:
        that:
          - >-
            (features.networking.systemd_resolved.dnssec | default('allow-downgrade') | string | lower)
            in ['yes', 'no', 'allow-downgrade', 'true', 'false', '1', '0']
          - >-
            (features.networking.systemd_resolved.dnsovertls | default('opportunistic') | string | lower)
            in ['yes', 'no', 'opportunistic', 'true', 'false', '1', '0']
        fail_msg: "Invalid features.networking.systemd_resolved settings"
        success_msg: "systemd-resolved settings are valid"
      when:
        - features.networking.enabled | default(false)
        - features.networking.systemd_resolved.enabled | default(true)
      run_once: true

    - name: Warn when firewall feature is enabled on containers
      ansible.builtin.debug:
        msg: "INFO: features.firewall.enabled is true; set features.target.container_support.firewall=true to apply on container targets."
      when:
        - prism_is_container
        - features.firewall.enabled | default(false)
        - not prism_container_firewall_enabled
      run_once: true

    - name: Warn when audit logging feature is enabled on containers
      ansible.builtin.debug:
        msg: "INFO: features.audit_logging.enabled is true; set features.target.container_support.audit_logging=true to apply on container targets."
      when:
        - prism_is_container
        - features.audit_logging.enabled | default(false)
        - not prism_container_audit_enabled
      run_once: true

    - name: Extract root mount facts
      ansible.builtin.set_fact:
        prism_root_mount: "{{ (ansible_facts.mounts | selectattr('mount', 'equalto', '/') | list | first) | default({}) }}"

    - name: Calculate root disk usage percentage
      ansible.builtin.set_fact:
        prism_root_disk_usage_pct: >-
          {{
            (
              100
              - ((prism_root_mount.size_available | default(0) | float) * 100 / (prism_root_mount.size_total | default(1) | float))
            ) | round(0, 'common') | int
          }}
      when:
        - prism_root_mount is mapping
        - (prism_root_mount.size_total | default(0) | int) > 0

    - name: Ensure root mount facts are available
      ansible.builtin.assert:
        that:
          - prism_root_mount is mapping
          - (prism_root_mount.size_total | default(0) | int) > 0
        fail_msg: "Unable to determine root filesystem usage from gathered facts"
        success_msg: "Root filesystem usage facts collected successfully"

    - name: Warn if disk space is low
      ansible.builtin.debug:
        msg: "WARNING: Disk usage is at {{ prism_root_disk_usage_pct }}%"
      when: prism_root_disk_usage_pct | int > 80

    - name: Check available memory
      ansible.builtin.command: free -m
      register: memory_info
      changed_when: false

    - name: Display system resources
      ansible.builtin.debug:
        msg:
          - "Disk usage: {{ prism_root_disk_usage_pct }}%"
          - "Memory info:"
          - "{{ memory_info.stdout_lines }}"

    - name: Validation summary
      ansible.builtin.debug:
        msg:
          - "===== PRISM Pre-flight Validation Complete ====="
          - "Target: {{ inventory_hostname }}"
          - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "Platform: {{ prism_target_type_resolved }}"
          - "Python: {{ python_version.stdout }}"
          - "All prerequisites met. Ready to execute PRISM hardening."
